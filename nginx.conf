# Serves the static export in out/ (see Dockerfile). Port 3000 matches Coolify's
# exposed port for this app.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Content-hashed JS/CSS from Next: safe to cache forever.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Generated thumbnails (scripts/thumbs.mjs). Names are per video, not per
  # content, so cache for a week rather than forever.
  location /devrel/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Pages: /devrel -> devrel.html. Short edge cache; browsers revalidate.
  location / {
    add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400";
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
